<style>
    .glass-panel {
      background: rgba(21, 32, 49, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.05);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .radar-pulse {
      animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #fbbf24;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }
  </style>

<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen flex flex-col">

<header class="flex justify-between items-center w-full px-container-margin py-4 sticky top-0 z-50 bg-surface/10 backdrop-blur-3xl border-b border-white/20">
<div class="flex items-center gap-8">
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">Weather</h1>
<nav class="hidden md:flex gap-6">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface hover:bg-white/10 transition-all duration-300 px-3 py-1 rounded-lg" href="#">Dashboard</a>
<a class="font-body-md text-body-md text-primary font-bold border-b-2 border-primary pb-1" href="#">Map</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface hover:bg-white/10 transition-all duration-300 px-3 py-1 rounded-lg" href="#">Alerts</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface hover:bg-white/10 transition-all duration-300 px-3 py-1 rounded-lg" href="#">Locations</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-white/10 transition-all duration-300">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
<button class="p-2 rounded-full hover:bg-white/10 transition-all duration-300">
<span class="material-symbols-outlined text-primary">account_circle</span>
</button>

<!-- Main Map Canvas -->
<main class="relative flex-grow overflow-hidden">
<!-- Map Background -->
<div class="absolute inset-0 bg-surface">

<!-- Radar Overlay Effect (Simplified simulation) -->
<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 via-transparent to-tertiary/5 mix-blend-screen radar-pulse"></div>
</div>
<!-- Left: SideNavBar (Shared Component Identity) -->

<!-- UI Overlay Containers -->
<div class="absolute inset-0 pointer-events-none p-container-margin flex flex-col justify-between">
<!-- Top Row: Search & Layer Selector -->

<!-- Search Bar -->
<div class="glass-panel rounded-full px-6 py-3 flex items-center gap-3 w-full max-w-md">
<span class="material-symbols-outlined text-primary" data-icon="search">search</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface placeholder-on-surface-variant w-full font-body-md" placeholder="Search location..." type="text">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer" data-icon="my_location">my_location</span>
</div>
<!-- Layer Selector -->
<div class="glass-panel p-1 rounded-xl flex gap-1">
<button class="bg-primary-container text-on-primary-container px-4 py-2 rounded-lg font-label-caps text-label-caps flex items-center gap-2 transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="rainy">rainy</span>
            Precipitation

<button class="text-on-surface-variant hover:bg-white/5 px-4 py-2 rounded-lg font-label-caps text-label-caps flex items-center gap-2 transition-all">

            Wind

</div>
</div>
</div>
</div>

<div class="glass-panel flex flex-col rounded-xl overflow-hidden">
<button class="p-3 hover:bg-white/10 text-on-surface transition-colors border-b border-white/10">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="p-3 hover:bg-white/10 text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
</div>
<button class="glass-panel p-3 rounded-xl text-on-surface hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>

<footer class="w-full py-4 px-container-margin flex flex-col md:flex-row justify-between items-center text-center mt-auto bg-surface-dim/30 backdrop-blur-xl border-t border-white/10 z-50">
<div class="font-body-md text-body-md text-on-surface-variant flex gap-4 mb-2 md:mb-0">
<a class="hover:underline decoration-primary/50 opacity-80 hover:opacity-100 transition-opacity" href="#">Terms of Service</a>
<a class="hover:underline decoration-primary/50 opacity-80 hover:opacity-100 transition-opacity" href="#">Privacy Policy</a>

</div>
<div class="font-body-md text-body-md text-on-surface-variant">© 2024 Weather. Data provided by NOAA &amp; OpenWeather. Last updated: 2 mins ago.</div>
</footer>
<script>
    // Micro-interaction for the playback slider and buttons
    const playBtn = document.querySelector('button .material-symbols-outlined[data-icon="play_arrow"]');
    let isPlaying = false;

    playBtn?.parentElement.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? 'pause' : 'play_arrow';
      playBtn.setAttribute('data-icon', isPlaying ? 'pause' : 'play_arrow');
      
      if(isPlaying) {
        playBtn.parentElement.classList.add('animate-pulse');
      } else {
        playBtn.parentElement.classList.remove('animate-pulse');
      }
    });

    // Layer selector interaction
    const layerButtons = document.querySelectorAll('.glass-panel button');
    layerButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        layerButtons.forEach(b => {
          b.classList.remove('bg-primary-container', 'text-on-primary-container');
          b.classList.add('text-on-surface-variant');
        });
        btn.classList.add('bg-primary-container', 'text-on-primary-container');
        btn.classList.remove('text-on-surface-variant');
      });
    });
  </script>
